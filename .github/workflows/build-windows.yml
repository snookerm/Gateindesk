name: Build Windows

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: 'Release tag (e.g. nightly, v1.0.0)'
        type: string
        default: 'nightly'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'

env:
  # Upstream RustDesk tag we clone from (do NOT bump unless taking newer upstream)
  RUSTDESK_REV: "1.4.6"
  # GateInDesk own semver — bump THIS for releases. Updated on Cargo.toml,
  # pubspec.yaml, MSI filename, Release tag, deploy URL. One source of truth.
  GD_VERSION: "1.0.1"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  APP_NAME: "GateInDesk"
  MANUFACTURER: "GateInWeb"
  # NOTE: env block cannot reference its own keys (env.GD_VERSION is empty here).
  # Set TAG_NAME on workflow_dispatch input or derive at job-level (see below).
  TAG_NAME: "${{ inputs.upload-tag || '' }}"

  # Required repository secrets:
  #   RENDEZVOUS_SERVER  e.g. relay.example.com (no port)
  #   RS_PUB_KEY         server public key (ed25519, base64)
  #   BRANDING_URL       base URL where icon-300.png / icon.ico are hosted

jobs:
  generate-bridge:
    name: Generate flutter-rust-bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Clone upstream rustdesk + submodules
        shell: bash
        run: |
          git clone --depth=1 --branch=${RUSTDESK_REV} https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth=1

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04
          workspaces: rustdesk

      - name: Install Flutter (bridge-specific version)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen + cargo-expand
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          cd rustdesk/flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Run flutter-rust-bridge codegen
        shell: bash
        run: |
          cd rustdesk
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          ls -la src/bridge_generated*.rs flutter/lib/generated_bridge*.dart

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h
          retention-days: 1

  build-windows:
    name: GateInDesk Windows x86_64 (MSI installer)
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Validate required secrets are set
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          BRANDING_URL: ${{ secrets.BRANDING_URL }}
        run: |
          missing=0
          [ -z "$RENDEZVOUS_SERVER" ] && { echo "::error::secret RENDEZVOUS_SERVER not set"; missing=1; }
          [ -z "$RS_PUB_KEY" ] && { echo "::error::secret RS_PUB_KEY not set"; missing=1; }
          [ -z "$BRANDING_URL" ] && { echo "::error::secret BRANDING_URL not set"; missing=1; }
          [ "$missing" = "1" ] && { echo "Add secrets in Settings → Secrets and variables → Actions"; exit 1; }
          echo "all secrets present"

      - name: Checkout meta-repo
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Export Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Clone upstream rustdesk + submodules
        shell: bash
        run: |
          git clone --depth=1 --branch=${RUSTDESK_REV} https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth=1

      - name: Restore flutter-rust-bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk/

      - name: Verify bridge files in place
        shell: bash
        run: |
          cd rustdesk
          ls -la src/bridge_generated*.rs flutter/lib/generated_bridge*.dart
          echo "bridge files restored OK"

      - name: Patch config.rs fallback constants
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          set -e
          cd rustdesk
          F=libs/hbb_common/src/config.rs
          SERVER=$(printf '%s' "$RENDEZVOUS_SERVER" | tr -d '[:space:]')
          PUBKEY=$(printf '%s' "$RS_PUB_KEY" | tr -d '[:space:]')
          # Use | as sed delimiter (not / since URL/base64 may contain /)
          sed -i "s|\"rs-ny.rustdesk.com\"|\"${SERVER}\"|g" "$F"
          sed -i "s|\"OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=\"|\"${PUBKEY}\"|g" "$F"
          # Verify substitutions happened (don't log values themselves — secret leakage)
          grep -q "${SERVER}" "$F" || { echo "::error::server patch failed"; exit 1; }
          grep -q "${PUBKEY}" "$F" || { echo "::error::key patch failed"; exit 1; }
          echo "config.rs fallback patched OK"

      - name: Set GateInDesk version (Cargo.toml + Flutter pubspec)
        shell: bash
        run: |
          set -e
          cd rustdesk
          # 1) Cargo.toml — drives crate::VERSION (env!("CARGO_PKG_VERSION"))
          #    used by check_software_update comparison.
          # Cargo.toml upstream is always "1.4.6" (we clone tag 1.4.6 fresh
          # each build), so anchor literal "1.4.6" — not env value.
          sed -i 's|^version = "1.4.6"|version = "${{ env.GD_VERSION }}"|' Cargo.toml
          grep -q '^version = "${{ env.GD_VERSION }}"' Cargo.toml \
            || { echo "::error::Cargo.toml version patch failed"; exit 1; }
          # 2) Flutter pubspec — generates FLUTTER_VERSION_* macros consumed by
          #    flutter/windows/runner/Runner.rc (PE FileVersion/ProductVersion).
          if grep -qE '^version: ' flutter/pubspec.yaml; then
            sed -i 's|^version: .*|version: ${{ env.GD_VERSION }}+${{ github.run_number }}|' flutter/pubspec.yaml
          else
            echo "version: ${{ env.GD_VERSION }}+${{ github.run_number }}" >> flutter/pubspec.yaml
          fi
          echo "=== final versions ==="
          grep '^version' Cargo.toml flutter/pubspec.yaml

      - name: Patch common.rs — disable custom.txt signature verification
        shell: bash
        run: |
          set -e
          cd rustdesk
          F=src/common.rs
          # Original lines (around 2193-2196):
          #     let Ok(data) = sign::verify(&data, &pk) else {
          #         log::error!("Failed to dec custom client config");
          #         return;
          #     };
          # Trick: replace opening line so log::error/return/}; become a
          # dead `if false { ... }` block. Compiler happy, signature check
          # is bypassed at runtime, no semantic shift in surrounding code.
          BEFORE=$(grep -c "let Ok(data) = sign::verify(&data, &pk) else {" "$F" || echo 0)
          if [ "$BEFORE" != "1" ]; then
            echo "::error::Expected exactly 1 sign::verify line, found $BEFORE"
            exit 1
          fi
          sed -i 's|let Ok(data) = sign::verify(&data, \&pk) else {|let _ = pk; let data = data; if false {|' "$F"
          AFTER=$(grep -c "if false {" "$F" || echo 0)
          echo "common.rs patched (sign::verify dead-branched). 'if false {' count: $AFTER"

      - name: Install GateInDesk branding
        shell: bash
        run: |
          set -e
          cd rustdesk
          # Branding assets ship inside the meta-repo (patches/branding/),
          # not via a secret BRANDING_URL — atomic with the workflow that uses them.
          cp ../meta/patches/branding/logo.png flutter/assets/logo.png
          cp ../meta/patches/branding/icon.ico res/icon.ico
          cp ../meta/patches/branding/icon.ico res/tray-icon.ico
          cp ../meta/patches/branding/icon.ico flutter/windows/runner/resources/app_icon.ico
          # CRITICAL: Window class top-left titlebar icon is loaded at runtime
          # from data\flutter_assets\assets\icon.ico via LoadCustomIcon() in
          # flutter/windows/runner/win32_window.cpp:40-53. Without this file
          # Flutter falls back to IDI_APP_ICON from Runner.rc — which may not
          # repaint due to Windows icon cache. Copy our ico into Flutter assets
          # so it is bundled at build time and resolved at runtime.
          cp ../meta/patches/branding/icon.ico flutter/assets/icon.ico
          # CRITICAL: in-UI top-left logo widget (common.dart:3743) loads
          # 'assets/icon.svg' via SvgPicture.asset — upstream ships an
          # RustDesk blue-circle "G" SVG which we never replaced. Overwrite it
          # with our PNG wrapped in valid SVG (incident 2026-05-24 — user
          # screenshot showed blue G in title bar despite WM_SETICON being
          # set correctly).
          cp ../meta/patches/branding/icon.svg flutter/assets/icon.svg
          ls -la flutter/assets/logo.png flutter/assets/icon.ico flutter/assets/icon.svg res/icon.ico res/tray-icon.ico flutter/windows/runner/resources/app_icon.ico

      - name: Apply branding patches (text + URL rewrites)
        shell: bash
        run: |
          set -e
          cd rustdesk

          # 1. "Powered by RustDesk" hint top-left
          sed -i 's|"powered_by_me", "Powered by RustDesk"|"powered_by_me", "Powered by GateInDesk"|' src/lang/en.rs
          sed -i 's|"powered_by_me", "Основано на RustDesk"|"powered_by_me", "Работает на GateInDesk"|' src/lang/ru.rs

          # 1a. Auto-update: rewrite hardcoded version-check URL
          #     hbb_common/src/lib.rs:496 has const URL = "https://api.rustdesk.com/version/latest"
          sed -i 's|https://api.rustdesk.com/version/latest|https://api.azatmutq.com/api/version/latest|' libs/hbb_common/src/lib.rs

          # 1b. Auto-update: removal of `if is_custom_client() { return; }`
          #     guard in check_software_update is done by patches/branding.py
          #     (multi-line pattern, sed cant match across newlines reliably).

          # 2. Footer banner: change pricing URL to our register page,
          #    rewrite text to "Open your account"
          sed -i 's|const url = "https://rustdesk.com/pricing"|const url = "https://gateindesk.azatmutq.com/_admin/#/register"|' flutter/lib/desktop/pages/connection_page.dart
          sed -i 's|"setup_server_tip", "For faster connection, please set up your own server"|"setup_server_tip", "Open your personal account"|' src/lang/en.rs
          sed -i 's|"setup_server_tip", "Для более быстрого подключения настройте собственный сервер."|"setup_server_tip", "Откройте личный кабинет"|' src/lang/ru.rs

          # 3. About: Privacy + Website URLs (per user 1.5: must point to gateindesk.azatmutq.com)
          sed -i "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('https://gateindesk.azatmutq.com/privacy.html')|" flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i "s|launchUrlString('https://rustdesk.com')|launchUrlString('https://gateindesk.azatmutq.com')|" flutter/lib/desktop/pages/desktop_setting_page.dart

          # 3a. loadPowered (common.dart) — the underlined "Powered by …" hint in top-left
          #     opens a URL on click. Rewrite from rustdesk.com to gateindesk.azatmutq.com.
          sed -i "s|launchUrl(Uri.parse('https://rustdesk.com'))|launchUrl(Uri.parse('https://gateindesk.azatmutq.com'))|" flutter/lib/common.dart

          # 4. Copyright Purslane Ltd -> GateInWeb
          sed -i 's|Purslane Ltd|GateInWeb|g' flutter/lib/desktop/pages/desktop_setting_page.dart

          # 5. Slogan_tip -> our slogan
          sed -i 's|"Slogan_tip", "Made with heart in this chaotic world!"|"Slogan_tip", "Безопасный удалённый доступ"|' src/lang/en.rs
          sed -i 's|"Slogan_tip", "Сделано с душой в этом безумном мире!"|"Slogan_tip", "Безопасный удалённый доступ"|' src/lang/ru.rs

          # 6. install_tip UAC text — replace RustDesk -> GateInDesk
          sed -i 's|RustDesk can not work properly|GateInDesk can not work properly|' src/lang/en.rs
          sed -i 's|click the button below to install RustDesk|click the button below to install GateInDesk|' src/lang/en.rs
          sed -i 's|RustDesk может работать неправильно|GateInDesk может работать неправильно|' src/lang/ru.rs
          sed -i 's|для установки RustDesk в системе|для установки GateInDesk в системе|' src/lang/ru.rs

          # 7. Multi-line inserts (About link / register button / oidc guard)
          #    are in a separate Python script to avoid heredoc-in-YAML escaping.
          python3 ../meta/patches/branding.py

          echo "all branding patches applied"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "C:/hostedtoolcache/windows/flutter/stable-${env:FLUTTER_VERSION}-x64/bin/cache/artifacts/engine/windows-x64-release/"
          if (-not (Test-Path $engineDir)) { New-Item -ItemType Directory -Force -Path $engineDir | Out-Null }
          Move-Item -Force windows-x64-release/* $engineDir

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-gateindesk
          workspaces: rustdesk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          set -e
          cd rustdesk
          n=0; max=3
          until "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; do
            n=$((n+1))
            if [ $n -ge $max ]; then
              echo "::error::vcpkg install failed after $max attempts"; exit 1
            fi
            echo "::warning::attempt $n failed (likely GitHub 502/transient), retrying in $((n*60))s"
            sleep $((n*60))
          done

      - name: Build RustDesk binary (build.py)
        shell: pwsh
        run: |
          cd rustdesk
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          Move-Item -Force ./flutter/build/windows/x64/runner/Release ./gateindesk
          # build.py emits 'rustdesk.exe' (from Cargo.toml package name).
          # MSI preprocess.py:458 looks for "${app_name}.exe" → rename.
          if (Test-Path ./gateindesk/rustdesk.exe) {
            Move-Item -Force ./gateindesk/rustdesk.exe "./gateindesk/${env:APP_NAME}.exe"
          }
          Get-ChildItem ./gateindesk/*.exe | Select-Object Name,Length

      - name: Generate custom.txt (HARD_SETTINGS injection)
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          set -e
          cd rustdesk
          SERVER=$(printf '%s' "$RENDEZVOUS_SERVER" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RS_PUB_KEY" | tr -d '[:space:]')
          # Server settings go into override-settings (force-applied on every start).
          # Top-level HARD_SETTINGS-style hide-* keys removed per user request
          # 2026-05-23 (Network tab stays visible).
          python3 -c "
          import json, base64
          # CUSTOM.TXT STRUCTURE NOTES (learned the hard way 2026-05-24):
          #
          # override-settings  -> applied EVERY START, user CANNOT change
          #                       (use for: server endpoints, build-in flags
          #                        that must stay locked like hide-server-settings)
          # default-settings   -> applied ONLY when LocalConfig key absent
          #                       (use for: initial defaults user CAN override later
          #                        like allow-remote-config-modification toggle)
          # top-level keys     -> go into HARD_SETTINGS (only useful for
          #                       app-name lookup, NOT for hide-* / toggle flags)
          #
          # See src/common.rs:2225-2252 + libs/hbb_common/src/config.rs:3080-3094.
          cfg = {
              'app-name': '${APP_NAME}',
              'override-settings': {
                  'custom-rendezvous-server': '${SERVER}',
                  'relay-server': '${SERVER}:21117',
                  # NEW: client API moved to api.azatmutq.com (dedicated vhost
                  # with rate-limit + security headers). relay.azatmutq.com
                  # still serves /api/* for backward compat with older installs.
                  'api-server': 'https://api.azatmutq.com',
                  'key': '${KEY}',
                  'hide-server-settings': 'Y',
              },
              'default-settings': {
                  'allow-remote-config-modification': 'Y',
                  # Enable auto-update check; user can opt out in Settings.
                  'enable-check-update': 'Y',
              },
          }
          enc = base64.b64encode(json.dumps(cfg).encode()).decode()
          open('./gateindesk/custom.txt', 'w').write(enc)
          print(f'custom.txt: {len(enc)} bytes (base64)')
          "
          ls -la ./gateindesk/custom.txt

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Pre-flight diagnostics for MSI build
        shell: bash
        run: |
          set -x
          cd rustdesk/res/msi
          pwd
          ls -la
          echo "=== requirements.txt content ==="
          cat requirements.txt 2>&1 || echo "NO requirements.txt"
          echo "=== msi.sln presence ==="
          ls -la msi.sln 2>&1 || echo "NO msi.sln"
          echo "=== preprocess.py args ==="
          python preprocess.py --help 2>&1 | head -40 || echo "preprocess.py --help failed"
          echo "=== tools versions ==="
          which msbuild || echo "no msbuild in PATH"
          which nuget || echo "no nuget in PATH"
          which python || echo "no python"
          msbuild -version 2>&1 | head -3 || true
          nuget help 2>&1 | head -3 || true

      - name: Build MSI installer
        shell: pwsh
        env:
          APP_NAME: ${{ env.APP_NAME }}
          MANUFACTURER: ${{ env.MANUFACTURER }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location rustdesk/res/msi

          if (Test-Path requirements.txt) {
            pip3 install -r requirements.txt
          } else {
            Write-Host "no requirements.txt - skip pip install"
          }

          # preprocess.py:474 falls back to running '$dist_app --version' when -v omitted.
          # Pass -v explicitly so it does NOT invoke the .exe for version detection.
          # preprocess.py:485 still invokes '--build-date' on the .exe; .exe must exist
          # under the expected name (handled by rename step in 'Build RustDesk binary').
          python preprocess.py `
            --arp `
            --app-name "$env:APP_NAME" `
            --manufacturer "$env:MANUFACTURER" `
            -v "$env:RUSTDESK_REV" `
            --custom `
            -d ../../gateindesk

          nuget restore msi.sln

          msbuild msi.sln `
            -p:Configuration=Release `
            -p:Platform=x64 `
            /p:TargetVersion=Windows10

          New-Item -ItemType Directory -Force -Path ../../SignOutput | Out-Null
          Write-Host "=== finding MSI ==="
          $msi = Get-ChildItem -Path ./Package -Recurse -Filter "*.msi" | Select-Object -First 1
          if ($null -eq $msi) {
            Write-Host "::error::MSI not found under ./Package/"
            Get-ChildItem -Path ./Package -Recurse | Select-Object FullName | Format-Table -AutoSize
            exit 1
          }
          $dst = "../../SignOutput/$($env:APP_NAME)-$($env:GD_VERSION)-x86_64.msi"
          Move-Item -Force $msi.FullName $dst
          Get-ChildItem ../../SignOutput/

      - name: Compute SHA256
        shell: bash
        run: |
          cd rustdesk/SignOutput
          sha256sum *.msi > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateindesk-windows-x86_64-msi
          path: rustdesk/SignOutput/
          retention-days: 30

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.upload-tag || format('v{0}', env.GD_VERSION) }}
          prerelease: false
          files: rustdesk/SignOutput/*

      # Auto-deploy MSI to download.azatmutq.com + update version endpoint.
      # Skipped silently if VPS_SSH_KEY secret is not configured — manual
      # deploy step remains an option.
      - name: Deploy MSI to VPS + bump version endpoint
        if: env.VPS_KEY != ''
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: claude-relay@78.24.218.158
          VPS_PORT: 22
        shell: bash
        run: |
          set -e
          # Write key to file, strict perms
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${VPS_PORT} -H 78.24.218.158 >> ~/.ssh/known_hosts 2>/dev/null

          MSI="rustdesk/SignOutput/${APP_NAME}-${GD_VERSION}-x86_64.msi"
          REMOTE_DIR="/opt/mirrors/gateindesk/v${GD_VERSION}"
          REMOTE_LATEST="/opt/mirrors/gateindesk"

          # 1) Upload MSI to versioned dir
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_HOST "sudo mkdir -p $REMOTE_DIR && sudo chown claude-relay:claude-relay $REMOTE_DIR"
          scp -i ~/.ssh/deploy_key -P $VPS_PORT "$MSI" "$VPS_HOST:$REMOTE_DIR/"
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_HOST "sudo chown www-data:www-data $REMOTE_DIR/*.msi && sudo chmod 644 $REMOTE_DIR/*.msi"

          # 2) Update /api/version/latest endpoint via inline JSON in nginx vhost
          NEW_JSON="{\"version\":\"${GD_VERSION}\",\"url\":\"https://github.com/snookerm/Gateindesk/releases/tag/v${GD_VERSION}\"}"
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_HOST "sudo sed -i 's|return 200 .*|return 200 '\''${NEW_JSON}'\'';|' /etc/nginx/sites-available/api.azatmutq.com && sudo nginx -t && sudo systemctl reload nginx"

          # 3) Mirror to /opt/mirrors/gateindesk/ root for backward compat
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_HOST "sudo cp $REMOTE_DIR/*.msi $REMOTE_LATEST/${APP_NAME}-${GD_VERSION}-x86_64.msi"

          # 4) Smoke-test endpoint returns new version
          DEPLOYED=$(curl -s -X POST https://api.azatmutq.com/api/version/latest -H 'Content-Type: application/json' -d '{}')
          echo "deployed: $DEPLOYED"
          echo "$DEPLOYED" | grep -q "${GD_VERSION}" || { echo "::error::version not reflected"; exit 1; }
          echo "deploy OK: v${GD_VERSION} live at download.azatmutq.com/gateindesk/v${GD_VERSION}/"
