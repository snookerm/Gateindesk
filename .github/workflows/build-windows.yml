name: Build Windows

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: 'Release tag (e.g. nightly, v1.0.0)'
        type: string
        default: 'nightly'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'

env:
  RUSTDESK_REV: "1.4.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"   # bridge codegen needs different flutter than build
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  APP_NAME: "GateInDesk"
  TAG_NAME: "${{ inputs.upload-tag || 'nightly' }}"

  # Required repository secrets:
  #   RENDEZVOUS_SERVER  e.g. some.host.example
  #   RS_PUB_KEY         server public key (ed25519, base64)
  #   BRANDING_URL       base URL where icon-300.png / icon.ico are hosted

jobs:
  generate-bridge:
    name: Generate flutter-rust-bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Clone upstream rustdesk + submodules
        shell: bash
        run: |
          git clone --depth=1 --branch=${RUSTDESK_REV} https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth=1

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04
          workspaces: rustdesk

      - name: Install Flutter (bridge-specific version)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen + cargo-expand
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          cd rustdesk/flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Run flutter-rust-bridge codegen
        shell: bash
        run: |
          cd rustdesk
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          ls -la src/bridge_generated*.rs flutter/lib/generated_bridge*.dart

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h
          retention-days: 1

  build-windows:
    name: GateInDesk Windows x86_64
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write  # needed for softprops/action-gh-release@v2 to create Release

    steps:
      - name: Validate required secrets are set
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          BRANDING_URL: ${{ secrets.BRANDING_URL }}
        run: |
          missing=0
          [ -z "$RENDEZVOUS_SERVER" ] && { echo "::error::secret RENDEZVOUS_SERVER not set"; missing=1; }
          [ -z "$RS_PUB_KEY" ] && { echo "::error::secret RS_PUB_KEY not set"; missing=1; }
          [ -z "$BRANDING_URL" ] && { echo "::error::secret BRANDING_URL not set"; missing=1; }
          [ "$missing" = "1" ] && { echo "Add secrets in Settings → Secrets and variables → Actions"; exit 1; }
          echo "all secrets present"

      - name: Checkout meta-repo
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Export Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Clone upstream rustdesk + submodules
        shell: bash
        run: |
          git clone --depth=1 --branch=${RUSTDESK_REV} https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth=1

      - name: Restore flutter-rust-bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk/

      - name: Verify bridge files in place
        shell: bash
        run: |
          cd rustdesk
          ls -la src/bridge_generated*.rs flutter/lib/generated_bridge*.dart
          echo "bridge files restored OK"

      - name: Patch config.rs (server + pub key) from secrets
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          cd rustdesk
          python3 - <<'PY'
          import os, pathlib, sys
          p = pathlib.Path('libs/hbb_common/src/config.rs')
          src = p.read_text()
          server = os.environ['RENDEZVOUS_SERVER'].strip()
          pubkey = os.environ['RS_PUB_KEY'].strip()
          patched = src.replace('"rs-ny.rustdesk.com"', f'"{server}"')
          if patched == src:
              print('::error::RENDEZVOUS_SERVERS substitution did not change config.rs', file=sys.stderr)
              sys.exit(1)
          src = patched
          patched = src.replace(
              '"OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw="',
              f'"{pubkey}"',
          )
          if patched == src:
              print('::error::RS_PUB_KEY substitution did not change config.rs', file=sys.stderr)
              sys.exit(1)
          p.write_text(patched)
          print(f'config.rs patched OK (server={len(server)}c, key={len(pubkey)}c)')
          PY

      - name: Download GateInDesk branding
        shell: bash
        env:
          BRANDING_URL: ${{ secrets.BRANDING_URL }}
        run: |
          cd rustdesk
          BRANDING_URL=$(printf '%s' "$BRANDING_URL" | tr -d '[:space:]' | sed 's:/*$::')
          curl -fsSL -o flutter/assets/logo.png "${BRANDING_URL}/icon-300.png"
          curl -fsSL -o res/icon.ico "${BRANDING_URL}/icon.ico"
          curl -fsSL -o flutter/windows/runner/resources/app_icon.ico "${BRANDING_URL}/icon.ico" || true

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "C:/hostedtoolcache/windows/flutter/stable-${env:FLUTTER_VERSION}-x64/bin/cache/artifacts/engine/windows-x64-release/"
          if (-not (Test-Path $engineDir)) { New-Item -ItemType Directory -Force -Path $engineDir | Out-Null }
          Move-Item -Force windows-x64-release/* $engineDir

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-gateindesk
          workspaces: rustdesk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          cd rustdesk
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build GateInDesk
        shell: pwsh
        run: |
          cd rustdesk
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          Move-Item -Force ./flutter/build/windows/x64/runner/Release ./gateindesk

      - name: Build self-extracted installer
        shell: bash
        run: |
          cd rustdesk
          sed -i '/dpiAware/d' res/manifest.xml || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../gateindesk/ -o . -e ../../gateindesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${APP_NAME}-${RUSTDESK_REV}-x86_64-Setup.exe"

      - name: Compute SHA256
        shell: bash
        run: |
          cd rustdesk/SignOutput
          sha256sum *.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateindesk-windows-x86_64
          path: rustdesk/SignOutput/
          retention-days: 30

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || inputs.upload-tag != 'nightly'
        with:
          tag_name: ${{ env.TAG_NAME }}
          prerelease: ${{ env.TAG_NAME == 'nightly' }}
          files: rustdesk/SignOutput/*
