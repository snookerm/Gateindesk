name: Build macOS

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: 'Release tag (optional)'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - 'patches/branding.py'
      - 'patches/branding/**'

env:
  RUSTDESK_REV: "1.4.6"
  # Pin to the same GD_VERSION as Windows pipeline. Bump in build-windows.yml,
  # this workflow follows. Filename: GateInDesk-{V}-{arch}.dmg.
  GD_VERSION: "1.0.7"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  APP_NAME: "GateInDesk"
  MANUFACTURER: "GateInWeb"
  BUNDLE_ID: "com.gateinweb.gateindesk"

jobs:
  generate-bridge:
    name: Generate flutter-rust-bridge (shared with Windows)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Clone upstream rustdesk + submodules
        shell: bash
        run: |
          git clone --depth=1 --branch=${RUSTDESK_REV} https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth=1

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04
          workspaces: rustdesk

      - name: Install Flutter (bridge-specific version)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen + cargo-expand
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          cd rustdesk/flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Run flutter-rust-bridge codegen
        shell: bash
        run: |
          cd rustdesk
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          ls -la src/bridge_generated*.rs flutter/lib/generated_bridge*.dart

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h
          retention-days: 1

  build-macos:
    name: GateInDesk macOS ${{ matrix.job.arch }}
    needs: generate-bridge
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: macos-15-intel, arch: x86_64,  target: x86_64-apple-darwin,  extra: "",                  vcpkg: x64-osx }
          - { os: macos-14,       arch: aarch64, target: aarch64-apple-darwin, extra: "--screencapturekit", vcpkg: arm64-osx }
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          missing=0
          [ -z "$RENDEZVOUS_SERVER" ] && { echo "::error::RENDEZVOUS_SERVER not set"; missing=1; }
          [ -z "$RS_PUB_KEY" ] && { echo "::error::RS_PUB_KEY not set"; missing=1; }
          [ "$missing" = "1" ] && exit 1
          echo "all required secrets present (signing optional via MACOS_P12_BASE64)"

      - name: Checkout meta-repo
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Export Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Clone upstream rustdesk + submodules
        shell: bash
        run: |
          git clone --depth=1 --branch=${RUSTDESK_REV} https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth=1

      - name: Restore flutter-rust-bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk/

      - name: Install build runtime (brew)
        run: |
          brew install llvm create-dmg
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: Install NASM 2.16 (not 3.x from brew)
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter scheduler workaround
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i '' -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart || true

      - name: Install Rust toolchain (Mac-specific 1.81)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-gateindesk-${{ matrix.job.arch }}
          workspaces: rustdesk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          cd rustdesk
          if ! "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.job.vcpkg }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" | head -20 | while read -r f; do
              echo "=== $f ==="; cat "$f"
            done
            exit 1
          fi

      - name: Patch config.rs fallback constants
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          set -e
          cd rustdesk
          F=libs/hbb_common/src/config.rs
          SERVER=$(printf '%s' "$RENDEZVOUS_SERVER" | tr -d '[:space:]')
          PUBKEY=$(printf '%s' "$RS_PUB_KEY" | tr -d '[:space:]')
          sed -i '' "s|\"rs-ny.rustdesk.com\"|\"${SERVER}\"|g" "$F"
          sed -i '' "s|\"OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=\"|\"${PUBKEY}\"|g" "$F"
          grep -q "${SERVER}" "$F" || { echo "::error::server patch failed"; exit 1; }
          echo "config.rs patched"

      - name: Set GateInDesk version
        shell: bash
        run: |
          set -e
          cd rustdesk
          sed -i '' 's|^version = "1.4.6"|version = "${{ env.GD_VERSION }}"|' Cargo.toml
          if grep -qE '^version: ' flutter/pubspec.yaml; then
            sed -i '' 's|^version: .*|version: ${{ env.GD_VERSION }}+${{ github.run_number }}|' flutter/pubspec.yaml
          else
            echo "version: ${{ env.GD_VERSION }}+${{ github.run_number }}" >> flutter/pubspec.yaml
          fi
          grep '^version' Cargo.toml flutter/pubspec.yaml

      - name: Patch common.rs (disable signature verification)
        shell: bash
        run: |
          set -e
          cd rustdesk
          F=src/common.rs
          sed -i '' 's|let Ok(data) = sign::verify(&data, \&pk) else {|let _ = pk; let data = data; if false {|' "$F"
          grep -q "if false {" "$F" || { echo "::error::common.rs patch failed"; exit 1; }

      - name: Install GateInDesk branding (PNG/SVG + iconset)
        shell: bash
        run: |
          set -e
          cd rustdesk
          cp ../meta/patches/branding/logo.png flutter/assets/logo.png
          cp ../meta/patches/branding/icon.svg flutter/assets/icon.svg
          # macOS .icns generation — convert from brand-pack PNG via sips + iconutil.
          mkdir -p icon.iconset
          PNG="../meta/patches/branding/logo.png"
          sips -z 16 16     "$PNG" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "$PNG" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "$PNG" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "$PNG" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "$PNG" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "$PNG" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "$PNG" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "$PNG" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "$PNG" --out icon.iconset/icon_512x512.png
          # Replace existing app icons in AppIcon.appiconset by resampling source PNG.
          ICON_SET=flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset
          if [ -d "$ICON_SET" ]; then
            for f in "$ICON_SET"/*.png; do
              size_name=$(basename "$f" .png)
              if [[ "$size_name" =~ app_icon_([0-9]+) ]]; then
                size=${BASH_REMATCH[1]}
                sips -z "$size" "$size" "$PNG" --out "$f" 2>/dev/null || true
              fi
            done
          fi

      - name: Apply branding patches (Dart URL sweep + lang strings + Python)
        shell: bash
        run: |
          set -e
          cd rustdesk

          sed -i '' 's|"powered_by_me", "Powered by RustDesk"|"powered_by_me", "Powered by GateInDesk"|' src/lang/en.rs
          sed -i '' 's|"powered_by_me", "Основано на RustDesk"|"powered_by_me", "Работает на GateInDesk"|' src/lang/ru.rs

          sed -i '' 's|https://api.rustdesk.com/version/latest|https://api.azatmutq.com/api/version/latest|' libs/hbb_common/src/lib.rs

          sed -i '' 's|"setup_server_tip", "For faster connection, please set up your own server"|"setup_server_tip", "Open your personal account"|' src/lang/en.rs
          sed -i '' 's|"setup_server_tip", "Для более быстрого подключения настройте собственный сервер."|"setup_server_tip", "Откройте личный кабинет"|' src/lang/ru.rs

          # Global Dart URL sweep — covers EULA link in install_page + 4 other files.
          find flutter/lib -name '*.dart' -exec sed -i '' "s|https://rustdesk.com/privacy.html|https://gateindesk.azatmutq.com/privacy.html|g" {} +
          find flutter/lib -name '*.dart' -exec sed -i '' "s|https://rustdesk.com/download|https://download.azatmutq.com/gateindesk/|g" {} +
          find flutter/lib -name '*.dart' -exec sed -i '' "s|https://rustdesk.com/pricing|https://gateindesk.azatmutq.com/_admin/#/register|g" {} +
          find flutter/lib -name '*.dart' -exec sed -i '' "s|'https://rustdesk.com'|'https://gateindesk.azatmutq.com'|g" {} +
          find flutter/lib -name '*.dart' -exec sed -i '' "s|'https://rustdesk.com/'|'https://gateindesk.azatmutq.com/'|g" {} +
          find flutter/lib -name '*.dart' -exec sed -i '' 's|"https://rustdesk.com"|"https://gateindesk.azatmutq.com"|g' {} +

          sed -i '' 's|Purslane Ltd|GateInWeb|g' flutter/lib/desktop/pages/desktop_setting_page.dart

          sed -i '' 's|"Slogan_tip", "Made with heart in this chaotic world!"|"Slogan_tip", "Безопасный удалённый доступ"|' src/lang/en.rs
          sed -i '' 's|"Slogan_tip", "Сделано с душой в этом безумном мире!"|"Slogan_tip", "Безопасный удалённый доступ"|' src/lang/ru.rs

          sed -i '' 's|RustDesk can not work properly|GateInDesk can not work properly|' src/lang/en.rs
          sed -i '' 's|click the button below to install RustDesk|click the button below to install GateInDesk|' src/lang/en.rs
          sed -i '' 's|RustDesk может работать неправильно|GateInDesk может работать неправильно|' src/lang/ru.rs
          sed -i '' 's|для установки RustDesk в системе|для установки GateInDesk в системе|' src/lang/ru.rs

          python3 ../meta/patches/branding.py
          echo "branding patches applied"

      - name: Patch macOS Runner Info.plist + xcode bundle ID
        shell: bash
        run: |
          set -e
          cd rustdesk
          PLIST=flutter/macos/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName GateInDesk" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string GateInDesk" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName GateInDesk" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string GateInDesk" "$PLIST"
          XCPROJ=flutter/macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's|PRODUCT_BUNDLE_IDENTIFIER = com\.carriez\.flutter_hbb|PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }}|g' "$XCPROJ" || true
          echo "=== Info.plist after patch ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "CFBundleName|CFBundleDisplayName" || true

      - name: Set min macOS version (Apple Silicon only)
        if: matrix.job.arch == 'aarch64'
        shell: bash
        run: |
          cd rustdesk
          MIN_MACOS_VERSION="12.3"
          sed -i '' "s/MACOSX_DEPLOYMENT_TARGET=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i '' "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i '' "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i '' "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj

      - name: Build RustDesk macOS (build.py)
        shell: bash
        run: |
          set -e
          cd rustdesk
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra }}

      - name: Rename RustDesk.app → GateInDesk.app + inject custom.txt
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          set -e
          cd rustdesk
          BUILD_DIR=flutter/build/macos/Build/Products/Release
          SRC_APP="$BUILD_DIR/RustDesk.app"
          DST_APP="$BUILD_DIR/${APP_NAME}.app"
          if [ -d "$SRC_APP" ]; then
            mv "$SRC_APP" "$DST_APP"
          fi
          [ -d "$DST_APP" ] || { echo "::error::no .app bundle found"; exit 1; }

          SERVER=$(printf '%s' "$RENDEZVOUS_SERVER" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RS_PUB_KEY" | tr -d '[:space:]')
          python3 -c "
          import json, base64
          cfg = {
              'app-name': '${APP_NAME}',
              'override-settings': {
                  'custom-rendezvous-server': '${SERVER}',
                  'relay-server': '${SERVER}:21117',
                  'api-server': 'https://api.azatmutq.com',
                  'key': '${KEY}',
                  'hide-server-settings': 'Y',
              },
              'default-settings': {
                  'allow-remote-config-modification': 'Y',
                  'enable-check-update': 'Y',
              },
          }
          enc = base64.b64encode(json.dumps(cfg).encode()).decode()
          open('$DST_APP/Contents/Resources/custom.txt', 'w').write(enc)
          print(f'custom.txt: {len(enc)} bytes (base64)')
          "
          ls -la "$DST_APP/Contents/Resources/custom.txt"
          echo "=== final app bundle ==="
          ls -la "$DST_APP/Contents/MacOS/"

      - name: Create unsigned DMG
        shell: bash
        run: |
          set -e
          cd rustdesk
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i '' -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p SignOutput
          DMG_NAME="${APP_NAME}-${GD_VERSION}-${{ matrix.job.arch }}.dmg"
          create-dmg \
            --icon "${APP_NAME}.app" 200 190 \
            --hide-extension "${APP_NAME}.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "SignOutput/${DMG_NAME}" \
            "./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"
          ls -la SignOutput/

      - name: Compute SHA256
        shell: bash
        run: |
          cd rustdesk/SignOutput
          shasum -a 256 *.dmg > SHA256SUMS-${{ matrix.job.arch }}
          cat SHA256SUMS-${{ matrix.job.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateindesk-macos-${{ matrix.job.arch }}
          path: rustdesk/SignOutput/
          retention-days: 30

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.upload-tag || env.GD_VERSION }}
          prerelease: false
          files: rustdesk/SignOutput/*.dmg

      - name: Deploy DMG to VPS
        if: env.VPS_KEY != ''
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: claude-relay@78.24.218.158
          VPS_PORT: 22
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${VPS_PORT} -H 78.24.218.158 >> ~/.ssh/known_hosts 2>/dev/null

          DMG="rustdesk/SignOutput/${APP_NAME}-${GD_VERSION}-${{ matrix.job.arch }}.dmg"
          REMOTE_DIR="/opt/mirrors/gateindesk/v${GD_VERSION}"

          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_HOST "sudo mkdir -p $REMOTE_DIR && sudo chown -R claude-relay:claude-relay $REMOTE_DIR"
          scp -i ~/.ssh/deploy_key -P $VPS_PORT "$DMG" "$VPS_HOST:$REMOTE_DIR/"
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_HOST \
            "sudo chown www-data:www-data $REMOTE_DIR/*.dmg && sudo chmod 644 $REMOTE_DIR/*.dmg"
          echo "deploy OK: ${APP_NAME}-${GD_VERSION}-${{ matrix.job.arch }}.dmg at download.azatmutq.com/gateindesk/v${GD_VERSION}/"
